# Render Blueprint (https://render.com/docs/blueprint-spec). Free-tier web
# service running the Dockerfile at repo root -- BM25 sparse retrieval only
# (no dense embedder in-process), sized to fit the free plan's 512MB RAM.
#
# Requires a separate Qdrant Cloud cluster (free tier: 1GB RAM / 4GB disk,
# https://cloud.qdrant.io) -- this blueprint does not provision one. Set
# QDRANT_URL / QDRANT_API_KEY to that cluster's values, either in the Render
# dashboard (Environment tab) or by filling in `sync: false` vars on first
# deploy; they are not committed here.
services:
  - type: web
    name: speculative-rag-webapp
    runtime: docker
    plan: free
    region: frankfurt  # matches the Qdrant Cloud cluster's eu-central-1 (AWS Frankfurt) region --
                        # unset before, which meant Render's default (Oregon, US West) vs. a
                        # Frankfurt Qdrant cluster: a transatlantic hop on every retrieval call,
                        # measured at ~175-215ms RTT alone (see results/latency_rag.md)
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/collections
    envVars:
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: SARVAM_API_KEY
        sync: false
